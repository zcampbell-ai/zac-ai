[project]
name = "zacai"
version = "0.1.0"
description = "Zac AI - personal and business AI operating system"
authors = [
    { name = "Zac Campbell", email = "zcampbell@brainstormtech.io" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "alembic>=1.13",
    "boto3>=1.34",
]

[project.scripts]
zacai = "zacai.main:run"
zacai-backup = "zacai.backup:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # D031B: hermetic S3-compatible backend tests only - mocks boto3
    # calls in-process, no real network/account/credential. Test-only,
    # never imported by application code.
    "moto[s3]>=5.0",
    # Type stubs for mypy --strict against boto3's dynamically-generated
    # client - type-checking only, no runtime dependency.
    "boto3-stubs[s3]>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["zacai"]
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
