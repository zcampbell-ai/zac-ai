# Zac AI Gitleaks configuration (DECISIONS.md D022).
#
# Extends Gitleaks' default ruleset with no changes. This file exists so the
# pre-commit hook has an explicit, versioned config to point at rather than
# relying on Gitleaks' implicit "no config file found" fallback.
#
# Add an allowlist entry here only when a specific, real false positive
# appears, and keep it as narrow as possible:
#   1. Prefer a trailing `gitleaks:allow` comment on the exact matching line
#      in the source file itself - this is the narrowest option and needs no
#      change here.
#   2. Only if that is not possible, add a scoped [[rules]] regex/path
#      allowlist entry below, with a comment explaining exactly why.
# Never exclude an entire file and never disable a detector/rule wholesale.

title = "Zac AI"

[extend]
useDefault = true

# Actual false positive: this one fixed PUBLIC fixture tokenizer SHA-256 is
# prospective comparison metadata, not an API credential. JSON cannot carry an
# inline allow comment. Match only this value, field and exact fixture path; all
# other values and default secret detectors remain enabled.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Fixed public complete-review fixture tokenizer SHA-256"
  condition = "AND"
  regexTarget = "match"
  regexes = ['''tokenizer_digest"\s*:\s*"66fb5e33a41d055ab4715715fbad9240ee8c97d8a9508f7eabbcf5e32cbb6df3''']
  paths = ['''(^|/)tests/fixtures/complete_review_public/review-profile\.json$''']
